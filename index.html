<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Braindump</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div id="container">
        <div id="top-header">
            <h3>Today: <span id="current-date"></span></h3>
            <h1>
                Braindump <i class="fa-solid fa-brain"></i>
            </h1>
            <span><i class="fa-solid fa-sun hidden" onclick="toggleDarkTheme('light')" id="light"></i><i class="fa-regular fa-sun" onclick="toggleDarkTheme('dark')" id="dark"></i></i></span>
        </div>
        <h2><span id="timeofday"></span></h2>
        <div id="organizeday">
            <div id="userinput">
                <form>
                    <div>
                        <textarea name="todo" id="todo" cols="80" rows="10" placeholder="What's on your mind today? e.g., I need to buy groceries, finish the Q3 report by 3 PM, call mom, and fix the leaky sink..."></textarea>
                    </div>
                </form>
                <button onclick="organizeMyDay()" id="organize">Organize My Day ✨</button>
                <div class="hidden" id="loader">
                    <div class="loader"></div>
                    <h4>AI is working to get the best possible organized schedule for your day</h4>
                </div>
            </div>
            <div id="activities">
                
            </div>
        </div>
    </div>
    <script src="./index.js"></script>
</body>
</html>
